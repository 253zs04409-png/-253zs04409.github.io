<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボタンであいさつ</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <h1>ボタンであいさつ</h1>

  <p id="message">ボタンを押してください。</p>

  <button type="button" onclick="showMessage()">あいさつする</button>

  <script>
    function showMessage() {
      document.getElementById("message").textContent = "こんにちは！";
    }
  </script>
</body>
</html>
